 "وأفضل أقول لنفسي وأنا بفكّر فيكي",
 "ربنا يقدّرني أفرّح قلبك وأكون ليكي",
 "ويجمعنا بالحلال ويبارك لنا فيكي",
 "وأعيش العمر كله حكاية أحلى بيكي"
];

const PAL=[["#ff9fb2","#e0245e","#6e0b2b"],["#ffc2cf","#ff4d79","#8f1440"],["#ffd8b5","#ff8a5c","#a8341a"],["#ff6b88","#c9184a","#4f0a1f"],["#fff0f3","#ffb3c6","#d9537a"]];
const PET="M0,0 C-38,-14 -46,-58 -10,-77 C-3,-80 3,-80 10,-77 C46,-58 38,-14 0,0Z";
let RN=0;
function rose(x,y,s,rot,pi){
 const [a,b,c]=PAL[pi%PAL.length],id="rg"+(RN++);
 const defs=`<radialGradient id="${id}a" cx="50%" cy="92%" r="105%"><stop offset="0" stop-color="${c}"/><stop offset=".5" stop-color="${b}"/><stop offset="1" stop-color="${a}"/></radialGradient><radialGradient id="${id}b" cx="50%" cy="90%" r="100%"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${b}"/></radialGradient>`;
 let g="";
 const ring=(n,sc,off,gr)=>{for(let i=0;i<n;i++){const r=off+i*360/n+Math.sin(i*7+sc*9)*6;
  g+=`<g transform="rotate(${r.toFixed(1)}) scale(${sc})"><path d="${PET}" fill="url(#${id}${gr})" stroke="${c}" stroke-opacity=".7" stroke-width="1.2"/><path d="M-30,-60 C-20,-76 20,-76 30,-60" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/><path d="M-12,-12 C-26,-30 -26,-52 -14,-66" fill="none" stroke="${c}" stroke-opacity=".25" stroke-width="3"/></g>`}};
 ring(6,1.12,0,"b");ring(5,.92,28,"a");ring(5,.7,50,"b");ring(4,.5,12,"a");ring(3,.32,70,"b");
 g+=`<path d="M-5,1 a6,6 0 1 1 7,5 a10,10 0 0 1 -12,-9" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"/><ellipse cx="-8" cy="-26" rx="12" ry="5" fill="#fff" opacity=".18" transform="rotate(-25)"/>`;
 return `<defs>${defs}</defs><g transform="translate(${x},${y}) rotate(${rot}) scale(${s})" filter="url(#sh)">${g}</g>`;
}
function bouquet(el,list,h){
 let st="",lv="",rs="";
 list.forEach(([x,y,s,r,p,x0],i)=>{
  const mx=(x+x0)/2+(i%2?18:-18),ly=y+(h-y)*.55,lx=(x+x0)/2+(i%2?10:-10),d=i%2?1:-1;
  st+=`<path d="M${x0},${h} Q${mx},${(y+h)/2} ${x},${y}" stroke="#1d5a2e" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  lv+=`<use href="#leaf" transform="translate(${lx},${ly}) rotate(${d*62}) scale(.62)"/><use href="#leaf" transform="translate(${lx+d*8},${ly+40}) rotate(${-d*58}) scale(.55)"/>`;
  rs+=rose(x,y,s,r,p);
 });
 el.innerHTML=st+lv+rs;
}
bouquet(document.getElementById('b1'),[[120,205,1.12,-10,0,105],[215,140,1.5,14,3,200],[260,255,1.05,40,1,290],[70,300,.8,-25,2,60]],420);
bouquet(document.getElementById('b2'),[[165,235,1.1,20,1,125],[200,165,1.45,-12,0,210],[285,215,1.2,30,2,300],[330,330,.75,12,4,350]],420);
document.getElementById('fbr').innerHTML=rose(0,12,1.2,0,3);

const ph=document.getElementById('ph');let curPh=null;
PHOTOS.forEach(p=>{
 const f=document.createElement('figure');f.className='ph';
 const im=new Image();im.referrerPolicy='no-referrer';im.alt='';im.src=p.src;
 im.onerror=()=>{f.dataset.bad=1;f.remove()};
 const c=document.createElement('figcaption');c.textContent=p.cap;
 f.append(im,c);ph.appendChild(f);p.el=f;
});
function showPhoto(i){
 const p=PHOTOS[i];if(!p||!p.el||p.el.dataset.bad)return;
 if(curPh)curPh.classList.remove('on');p.el.classList.add('on');curPh=p.el;
}
let K=1;
const sleep=ms=>new Promise(r=>setTimeout(r,ms*K));
const box=document.getElementById('lines'),stage=document.getElementById('stage');
const cur=Object.assign(document.createElement('span'),{className:'cur'});
async function type(item,cls){
 const o=typeof item==='string'?{t:item}:item;
 const d=document.createElement('div');d.className='ln'+(o.c?' '+o.c:'')+(cls?' '+cls:'');box.appendChild(d);
 const txt=document.createTextNode('');d.append(txt,cur);
 const slow=cls==='poem'?1.35:1;
 for(const ch of o.t){
  txt.nodeValue+=ch;stage.scrollTop=stage.scrollHeight;
  let w=34+Math.random()*44;
  if('،,.…'.includes(ch))w+=210;
  if(Math.random()<.04)w+=240;
  await sleep((o.c?w+18:w)*slow);
 }
 if(o.c||Math.random()<.15)d.classList.add('flick');
 await sleep(cls==='poem'?650:420);
}
async function poem(){
 await type({t:"سندس",c:"ptitle"},"");
 for(const l of POEM){
  if(l==="~"){await sleep(1100);continue}
  await type(l,"poem");
 }
 const s=document.createElement('div');s.className='ln sep';s.textContent='❀';box.appendChild(s);
}
function est(){
 const cw=(x,sl)=>{let t=0;for(const ch of x)t+=66+('،,.…'.includes(ch)?210:0);return t*sl};
 let t=0;
 for(const m of MSG){
  if(m==="~"){t+=1000;continue}
  if(m.photo!==undefined){t+=900;continue}
  if(m.poem){t+=cw("سندس",1)+420;for(const l of POEM)t+=l==="~"?1100:cw(l,1.35)+650;continue}
  const x=typeof m==='string'?m:m.t;t+=cw(x,1)+(m.c?18*x.length:0)+720;
 }
 return t;
}
async function run(){
 const a=document.getElementById('bgm');
 await new Promise(r=>{if(isFinite(a.duration)&&a.duration>0)return r();a.addEventListener('loadedmetadata',r,{once:true});setTimeout(r,2500)});
 const d=a.duration;
 K=(isFinite(d)&&d>30)?Math.min(1.5,Math.max(.5,(d*1000-10000)/est())):.75; // الرسالة تخلص قبل نهاية الأغنية بحوالي 10 ثواني
 await sleep(900);
 for(const m of MSG){
  if(m==="~"){await sleep(1000);continue}
  if(m.photo!==undefined){showPhoto(m.photo);await sleep(900);continue}
  if(m.poem){await poem();continue}
  await type(m);await sleep(300);
 }
}
const cv=document.getElementById('petals'),cx=cv.getContext('2d');
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
const COL=[["#ffb3c6","#e0245e"],["#fff0f3","#ff8fab"],["#ffd1dc","#ff4d79"]];
const P=Array.from({length:22},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:6+Math.random()*9,v:.4+Math.random()*.8,r:Math.random()*6,w:Math.random()*2,a:.5+Math.random()*.4,c:COL[Math.floor(Math.random()*3)]}));
(function draw(){
 cx.clearRect(0,0,cv.width,cv.height);
 for(const p of P){
  p.y+=p.v;p.r+=.015;p.w+=.02;p.x+=Math.sin(p.w)*.6;
  if(p.y>cv.height+20){p.y=-20;p.x=Math.random()*cv.width}
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=p.a;
  const g=cx.createRadialGradient(0,0,1,0,0,p.s);g.addColorStop(0,p.c[0]);g.addColorStop(1,p.c[1]);
  cx.fillStyle=g;cx.beginPath();cx.ellipse(0,0,p.s*.6,p.s,0,0,7);cx.fill();cx.restore();
 }
 requestAnimationFrame(draw);
})();
document.getElementById('go').onclick=()=>{
 const a=document.getElementById('bgm');a.volume=.7;let tried=false;
 a.onerror=()=>{if(!tried){tried=true;a.src=MUSIC_BACKUP;a.play().catch(()=>{})}};
 a.src=MUSIC_URL;a.play().catch(()=>{});
 const i=document.getElementById('intro');i.style.opacity=0;setTimeout(()=>i.remove(),1700);
 run();
};
(function(){
 const a=document.getElementById('bgm'),pp=document.getElementById('pp'),ppi=document.getElementById('ppi'),
  sk=document.getElementById('seek'),vo=document.getElementById('vol'),mu=document.getElementById('mu'),mui=document.getElementById('mui'),
  tc=document.getElementById('tc'),td=document.getElementById('td');
 const PLAY="M8 5v14l11-7z",PAUSE="M6 5h4v14H6zM14 5h4v14h-4z";
 const VON="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z";
 const VOFF="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z";
 const fmt=t=>isFinite(t)?Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0"):"0:00";
 const fill=(el,v)=>el.style.setProperty('--p',v+'%');
 const ui=()=>{ppi.setAttribute('d',a.paused?PLAY:PAUSE);mui.setAttribute('d',(a.muted||a.volume===0)?VOFF:VON)};
 pp.onclick=()=>{a.paused?a.play().catch(()=>{}):a.pause()};
 a.addEventListener('play',ui);a.addEventListener('pause',ui);a.addEventListener('volumechange',ui);
 a.addEventListener('loadedmetadata',()=>{td.textContent=fmt(a.duration)});
 a.addEventListener('timeupdate',()=>{
  if(a.duration){const v=a.currentTime/a.duration*1000;if(!sk._d){sk.value=v;fill(sk,v/10)}}
  tc.textContent=fmt(a.currentTime);
 });
 sk.addEventListener('input',()=>{sk._d=1;fill(sk,sk.value/10);tc.textContent=fmt(sk.value/1000*a.duration)});
 sk.addEventListener('change',()=>{if(a.duration)a.currentTime=sk.value/1000*a.duration;sk._d=0});
 vo.addEventListener('input',()=>{a.volume=vo.value/100;a.muted=false;fill(vo,vo.value)});
 mu.onclick=()=>{a.muted=!a.muted;ui()};
 a.volume=.7;fill(vo,70);fill(sk,0);ui();
})();
</script>
